<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset</title>
  </head>
  <body style="font-family: Arial, sans-serif; background-color: #f5f6fa; margin: 0; padding: 0;">
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 20px;">
          <table width="100%" max-width="600px" cellpadding="0" cellspacing="0" style="background: #ffffff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            <!-- Header -->
            <tr>
              <td style="background-color: #73c2be; padding: 30px; text-align: center; color: white;">
                <h1 style="margin: 0; font-size: 24px;">IGSSAX</h1>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding: 30px; color: #333;">
                <p>Hi {{ user.first_name }},</p>
                <p>You recently requested to reset your password. Click the button below to proceed:</p>
                <p style="text-align: center; margin: 30px 0;">
                  <a href="{{ reset_link }}" style="background-color: #73c2be; color: white; text-decoration: none; padding: 12px 25px; border-radius: 50px; font-weight: bold; display: inline-block;">
                    Reset Password
                  </a>
                </p>
                <p>If you did not request a password reset, you can safely ignore this email.</p>
                <p>Thanks,<br>The IGSSAX Team</p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="background-color: #f5f6fa; padding: 20px; text-align: center; font-size: 12px; color: #888;">
                © {{ now.year }} IGSSAX. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
